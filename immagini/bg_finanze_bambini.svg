<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3E0" />
      <stop offset="35%" stop-color="#FFE0B2" />
      <stop offset="70%" stop-color="#FFCCBC" />
      <stop offset="100%" stop-color="#F8BBD0" />
    </linearGradient>
    <linearGradient id="glassGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="glassGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E1F5FE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#B3E5FC" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#FFB74D" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1600" height="900" fill="url(#bgGrad)" />

  <!-- Soft Ambient Glow Orbs -->
  <circle cx="300" cy="250" r="220" fill="#FFECB3" opacity="0.6" filter="url(#softGlow)" />
  <circle cx="1300" cy="300" r="260" fill="#E1BEE7" opacity="0.5" filter="url(#softGlow)" />
  <circle cx="800" cy="700" r="300" fill="#C8E6C9" opacity="0.4" filter="url(#softGlow)" />

  <!-- Playful Decorative Clouds -->
  <g fill="#FFFFFF" opacity="0.65">
    <path d="M 150 160 Q 180 120 230 140 Q 280 110 320 150 Q 360 140 370 180 Q 380 220 340 230 L 160 230 Q 120 210 150 160 Z" />
    <path d="M 1200 120 Q 1240 80 1290 100 Q 1340 70 1380 110 Q 1420 100 1440 140 Q 1450 180 1400 190 L 1220 190 Q 1180 170 1200 120 Z" />
  </g>

  <!-- Big Glassmorphism Panel Center -->
  <rect x="250" y="150" width="1100" height="600" rx="36" fill="url(#glassGrad1)" stroke="#FFFFFF" stroke-width="2.5" filter="url(#shadow)" />

  <!-- Floating Kids Toy Elements & Wooden Blocks -->
  <!-- Block A (Orange) -->
  <g transform="translate(420, 360) rotate(-8)">
    <rect width="130" height="130" rx="20" fill="#FFA726" stroke="#FFFFFF" stroke-width="3" filter="url(#shadow)" />
    <text x="65" y="90" font-family="-apple-system, Roboto, sans-serif" font-size="70" font-weight="900" fill="#FFFFFF" text-anchor="middle">A</text>
  </g>

  <!-- Block B (Mint Green) -->
  <g transform="translate(570, 330) rotate(6)">
    <rect width="130" height="130" rx="20" fill="#66BB6A" stroke="#FFFFFF" stroke-width="3" filter="url(#shadow)" />
    <text x="65" y="90" font-family="-apple-system, Roboto, sans-serif" font-size="70" font-weight="900" fill="#FFFFFF" text-anchor="middle">B</text>
  </g>

  <!-- Block C (Soft Cyan) -->
  <g transform="translate(500, 210) rotate(-3)">
    <rect width="125" height="125" rx="20" fill="#42A5F5" stroke="#FFFFFF" stroke-width="3" filter="url(#shadow)" />
    <text x="62" y="86" font-family="-apple-system, Roboto, sans-serif" font-size="68" font-weight="900" fill="#FFFFFF" text-anchor="middle">C</text>
  </g>

  <!-- Cute Teddy Bear & Stroller Silhouette Graphic Card -->
  <g transform="translate(800, 240)">
    <rect width="440" height="340" rx="28" fill="url(#glassGrad2)" stroke="#FFFFFF" stroke-width="2" filter="url(#shadow)" />
    
    <!-- Big Heart / Star Badge -->
    <circle cx="220" cy="140" r="75" fill="url(#goldGrad)" opacity="0.9" filter="url(#shadow)" />
    <text x="220" y="165" font-size="80" text-anchor="middle">🧸</text>

    <!-- Playful Banner -->
    <rect x="70" y="245" width="300" height="50" rx="25" fill="#FFFFFF" opacity="0.95" />
    <text x="220" y="278" font-family="-apple-system, Roboto, sans-serif" font-size="20" font-weight="800" fill="#FF7043" text-anchor="middle">SPESE BAMBINI &amp; FAMIGLIA</text>
  </g>

  <!-- Floating Stars, Balloons & Notes -->
  <text x="350" y="280" font-size="45" opacity="0.85">⭐</text>
  <text x="740" y="200" font-size="40" opacity="0.8">🎈</text>
  <text x="1270" y="260" font-size="50" opacity="0.85">🌟</text>
  <text x="1230" y="580" font-size="42" opacity="0.8">🎨</text>
  <text x="380" y="600" font-size="44" opacity="0.8">🍼</text>
  <text x="740" y="640" font-size="48" opacity="0.85">🚀</text>

  <!-- Gentle Ambient Foreground Arc -->
  <path d="M 0 850 Q 800 780 1600 850 L 1600 900 L 0 900 Z" fill="#FFFFFF" opacity="0.4" />
</svg>
