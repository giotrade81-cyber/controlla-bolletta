<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Organizzazione e Agenda — AppUnic</title>
    <meta
      name="description"
      content="La tua agenda intelligente 100% Zero-Server. Gestisci impegni e priorità solo sul tuo dispositivo."
    />
    <meta name="robots" content="index, follow" />
    <style>
      :root {
        --carta: #FBF7EF;
        --inchiostro: #1A1714;
        --mandarino: #FF6A2B;
        --basilico: #1F7A4D;
        --bordo: #E4DACA;
        --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      body {
        margin: 0;
        font-family: var(--sans);
        background: linear-gradient(135deg, var(--carta) 0%, #fff0e6 100%);
        color: var(--inchiostro);
        min-height: 100vh;
      }
      nav {
        background: var(--inchiostro);
        color: white;
        padding: 10px 24px;
        display: flex;
        gap: 20px;
        align-items: center;
        position: sticky;
        top: 0;
        z-index: 1000;
      }
      .brand {
        font-weight: 800;
        font-size: 1.1rem;
        letter-spacing: 1px;
        color: white;
        text-decoration: none;
      }
      nav a {
        color: white;
        text-decoration: none;
        padding: 5px 10px;
        opacity: 0.7;
        border-radius: 4px;
      }
      nav a.active {
        background: rgba(255, 255, 255, 0.2);
        opacity: 1;
      }
      nav a:hover {
        opacity: 1;
      }
      .btn-personale {
        margin-left: auto;
        font-weight: bold;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        opacity: 1;
      }
      
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 3rem 1.5rem;
      }
      h1 {
        font-size: 2.5rem;
        margin-bottom: 0.5rem;
        text-align: center;
      }
      .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 3rem;
      }
      
      .dashboard {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2rem;
      }
      
      .panel {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 20px;
        padding: 2rem;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
      }
      
      .panel h2 {
        margin-top: 0;
        font-size: 1.4rem;
        border-bottom: 2px solid var(--bordo);
        padding-bottom: 10px;
        margin-bottom: 1.5rem;
      }

      /* Stili CRUD */
      .action-btns {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .btn-icon {
        background: rgba(255,255,255,0.8);
        border: 1px solid rgba(0,0,0,0.1);
        border-radius: 4px;
        padding: 5px 8px;
        cursor: pointer;
        font-size: 0.9rem;
        transition: all 0.2s;
      }
      .btn-icon:hover {
        background: white;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      }
      .btn-nuovo {
        display: inline-block;
        background: var(--mandarino);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        margin-bottom: 2rem;
        font-size: 1rem;
        box-shadow: 0 4px 15px rgba(255, 106, 43, 0.3);
        transition: transform 0.2s;
      }
      .btn-nuovo:hover {
        transform: translateY(-2px);
      }

      /* Modale Glassmorphism */
      .modal-overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.4);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 2000;
        backdrop-filter: blur(4px);
      }
      .modal-content {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 20px;
        padding: 2rem;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      }
      .modal-content h3 {
        margin-top: 0;
      }
      .form-group {
        margin-bottom: 15px;
      }
      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        font-size: 0.9rem;
      }
      .form-group input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-sizing: border-box;
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 20px;
      }
      .btn-cancel {
        background: #eee;
        border: none;
        padding: 8px 15px;
        border-radius: 6px;
        cursor: pointer;
      }
      .btn-save {
        background: var(--basilico);
        color: white;
        border: none;
        padding: 8px 15px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
      }

      @media (max-width: 768px) {
        .dashboard {
          grid-template-columns: 1fr;
        }
      }
    </style>
    <script type="module" crossorigin src="./assets/organizzazione-CF89NYam.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/VoiceAssistant-B8sDiOjw.js">
  </head>
  <body>
    <nav style="background: var(--inchiostro, #1A1714); color: white; padding: 10px 24px; display: flex; gap: 20px; align-items: center; position: sticky; top: 0; z-index: 1000;">
      <a href="./index.html" class="brand" style="font-weight: 800; font-size: 1.1rem; letter-spacing: 1px; color: white; text-decoration: none;">AppUnic</a>
      <div style="display: flex; gap: 15px; flex-wrap: wrap;">
        <a href="./bollette.html" style="color: white; text-decoration: none; font-weight: bold; opacity: 0.9;">Bollette</a>
        <a href="./spesasmart.html" style="color: white; text-decoration: none; font-weight: bold; opacity: 0.9;">SpesaSmart</a>
        <a href="./organizzazione.html" style="color: white; text-decoration: none; font-weight: bold; opacity: 0.9;">Organizzazione</a>
        <a href="./memorie.html" style="color: white; text-decoration: none; font-weight: bold; opacity: 0.9;">Memorie</a>
        <a href="#" style="color: white; text-decoration: none; font-weight: bold; opacity: 0.4; cursor: not-allowed;">Fisco</a>
        <a href="#" style="color: white; text-decoration: none; font-weight: bold; opacity: 0.4; cursor: not-allowed;">Salute</a>
      </div>
      <a href="./area-personale.html" style="margin-left: auto; color: white; text-decoration: none; padding: 5px 10px; font-weight: bold; background: rgba(255, 255, 255, 0.2); border-radius: 8px;">Area Personale</a>
    </nav>
    
    <div class="container">
      <h1>Organizzazione & Agenda</h1>
      <p class="subtitle">Il tuo assistente vocale intelligente per la produttività quotidiana.</p>
      
      <button class="btn-nuovo" id="btn-open-modal">+ Nuovo Promemoria</button>

      <div id="app-organizzazione">
        <!-- Contenuto generato da main.ts -->
        <div class="dashboard">
          <div class="panel">
            <h2>🔥 Priorità di Oggi</h2>
            <div id="lista-oggi">
              <p style="color: #888;">Caricamento task...</p>
            </div>
          </div>
          <div class="panel">
            <h2>📅 Prossimamente</h2>
            <div id="lista-prossimamente">
              <p style="color: #888;">Caricamento task...</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Modale CRUD -->
    <div class="modal-overlay" id="task-modal">
      <div class="modal-content">
        <h3 id="modal-title">Nuovo Promemoria</h3>
        <input type="hidden" id="task-id">
        <div class="form-group">
          <label>Titolo (Cosa devi fare?)</label>
          <input type="text" id="task-title" placeholder="Es: Pagare bolletta luce...">
        </div>
        <div class="form-group">
          <label>Data di Scadenza</label>
          <input type="date" id="task-date">
        </div>
        <div class="form-group">
          <label>Ora (Opzionale)</label>
          <input type="time" id="task-time">
        </div>
        <div class="modal-actions">
          <button class="btn-cancel" id="btn-cancel-modal">Annulla</button>
          <button class="btn-save" id="btn-save-modal">Salva</button>
        </div>
      </div>
    </div>
    
  </body>
</html>
